<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · Aruna</title><style>
:root{font-family:system-ui,sans-serif;color:#1d302a;background:#f4f6f2}*{box-sizing:border-box}body{margin:0}.top{border-bottom:1px solid #d7e2d8;background:#fff}.top-inner{max-width:1000px;margin:auto;padding:22px 26px;font-weight:750;letter-spacing:-.02em}.layout{max-width:1000px;margin:0 auto;padding:48px 26px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:60px}h1{font-size:2rem;letter-spacing:-.04em;margin:0 0 8px}h2{font-size:1rem;margin:0 0 18px}p{line-height:1.5;color:#4c6258}.intro{margin:0 0 32px}label{display:block;font-size:.9rem;font-weight:650;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid #aabbb0;border-radius:6px;font:inherit}input:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid #9a5e00;outline-offset:3px}.hint{font-size:.8rem;margin:8px 0 24px}.payment{border:1px solid #d7e2d8;border-radius:8px;padding:18px;margin:28px 0}.payment p{margin:0;font-size:.9rem}button{background:#205645;color:white;border:0;border-radius:6px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#173f33}.message{margin:18px 0 0;color:#7a3b10;font-weight:600}.summary{background:white;border:1px solid #d7e2d8;border-radius:8px;padding:24px;height:max-content}.row{display:flex;justify-content:space-between;gap:18px;padding:12px 0;color:#43584d}.total{border-top:1px solid #d7e2d8;font-weight:750;color:#1d302a}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media(max-width:720px){.layout{display:flex;flex-direction:column;gap:32px;padding:32px 20px}.summary{order:-1}.top-inner{padding:18px 20px}}
</style></head><body><header class="top"><div class="top-inner">Aruna</div></header><main class="layout"><section aria-labelledby="checkout-title"><h1 id="checkout-title">Checkout</h1><p class="intro">Selesaikan pesanan Anda.</p><form id="checkout"><label for="email">Alamat email</label><input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-help"><p class="hint" id="email-help">Konfirmasi pesanan akan dikirim ke alamat ini.</p><div class="payment"><h2>Pembayaran</h2><p>Metode pembayaran belum tersedia.</p></div><button type="submit">Bayar Rp280.000</button><p id="payment-status" class="message" role="status" tabindex="-1"></p><noscript>Pembayaran belum tersedia.</noscript></form></section><aside class="summary" aria-labelledby="summary-title"><h2 id="summary-title">Ringkasan pesanan</h2><div class="row"><span>Notebook A5 × 2</span><span>Rp240.000</span></div><div class="row"><span>Pengiriman</span><span>Rp40.000</span></div><div class="row total"><span>Total</span><span>Rp280.000</span></div></aside></main><script>
