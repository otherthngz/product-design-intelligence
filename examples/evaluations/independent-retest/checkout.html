<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title><style>
:root{font-family:system-ui,sans-serif;background:#f4f6f3;color:#21342a}*{box-sizing:border-box}main{max-width:600px;padding:48px 24px;margin:auto}h1{font-size:2rem;margin:0 0 24px}.summary{background:white;border:1px solid #dae3db;border-radius:6px;padding:24px}.row{display:flex;justify-content:space-between;padding:12px 0;gap:20px}.total{border-top:1px solid #dae3db;font-weight:700}button{font:inherit;color:white;background:#245642;padding:12px 20px;border:0;border-radius:6px;font-weight:700;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #9a5e00;outline-offset:3px}#status{color:#793e16;font-weight:650;line-height:1.5;margin-top:18px}@media(max-width:600px){main{padding:30px 16px}}
</style></head><body><main><h1>Checkout</h1><div class="summary"><h2>Ringkasan pesanan</h2><div class="row"><span>Notebook A5 × 2</span><span>Rp240.000</span></div><div class="row"><span>Pengiriman</span><span>Rp40.000</span></div><div class="row total"><span>Total</span><span>Rp280.000</span></div><p>Metode pembayaran belum tersedia.</p><button id="pay" type="button">Bayar Rp280.000</button><p id="status" role="status" tabindex="-1"></p></div></main><script>
document.querySelector('#pay').addEventListener('click',()=>{const status=document.querySelector('#status');status.textContent='Pembayaran belum tersedia. Tidak ada transaksi yang dilakukan.';status.focus();});
</script></body></html>
